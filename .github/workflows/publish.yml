name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11.9.0. Trusted publishing needs npm 11.5.1 or
          # later; Node 22 bundles npm 10.9.8, which has no OIDC support and
          # fails the publish with a 404.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      # Trusted publishing: npm exchanges an OIDC token for a short-lived publish
      # token, so no long-lived npm token is needed or wanted here.
      - run: npm publish
